[fetch_sample_info]
fl = title,emdb_id,resolution,fitted_pdbs,xref_UNIPROTKB,xref_ALPHAFOLD
fetch_classification = False
fetch_qscore = True
rows = 9999999

[redundancy_filter]
q_threshold = 0.5
uni_threshold = 0.7

[downloading_and_preprocessing]
overwrite = False
give_map = True
protein_tag_dist = 1
map_threashold = 0.15
vof_threashold = 0.25
dice_threashold = 0.4

[generate_dataset]
ratio_training = .8
ratio_testing = .1
ratio_validation = .1
npy_size = 64
extract_stride = 32
atom_grid_radius = 1.5
n_workers = 4

[directories]
cryo_data_bot_data_path = CryoDataBot_Data
metadata_path = Metadata
raw_path = Raw
sample_path = Sample
temp_path = Temp
test_path = Test

